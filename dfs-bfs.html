<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圖的走訪｜DFS 與 BFS</title>
  <style>
    :root{color-scheme:light;--page:#e8eef4;--paper:#fff;--ink:#193047;--muted:#71869a;--edge:#c4d0da;--blue:#2877b8;--green:#16866b;--amber:#f2a51a;--purple:#8061bd;--border:#d5dfe7}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{width:min(1100px,94%);margin:32px auto 48px}.header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.header h1{font-size:clamp(27px,4vw,38px);margin:0}.header p{margin:6px 0 0;color:var(--muted);line-height:1.6}.back{color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:18px;align-items:start}.panel{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 8px 24px #1930470c}.panel h2{font-size:18px;margin:0 0 5px}.caption{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 15px}.graph-frame{overflow:hidden;border-radius:14px;background:#dce5ed}.graph{display:block;width:100%;height:auto}.road{stroke:var(--edge);stroke-width:3}.road.found{stroke:var(--green);stroke-width:5}.trail{stroke:var(--purple);stroke-width:8;stroke-linecap:round;opacity:.7;pointer-events:none}.node circle{fill:#fff;stroke:#8399ad;stroke-width:2.5;transition:fill .2s,stroke .2s}.node.seen circle{fill:#c8eddf;stroke:var(--green)}.node.focus circle{fill:#ffda85;stroke:#d68b08;stroke-width:3}.node.along circle{fill:#e6ddf8;stroke:var(--purple)}.node-name{font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}.place{font-size:15px;text-anchor:middle;fill:#7890a5}.start-tag rect{fill:var(--ink)}.start-tag text{fill:#fff;font-size:11px;font-weight:750;text-anchor:middle;dominant-baseline:central}.cursor{fill:var(--amber);stroke:#fff;stroke-width:4;filter:drop-shadow(0 2px 3px #19304766);pointer-events:none}.legend{display:flex;flex-wrap:wrap;gap:12px 18px;margin:13px 2px 0;color:var(--muted);font-size:12px}.key{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%;background:#c8eddf;border:1px solid var(--green)}.dot.focus{background:#ffda85;border-color:#d68b08}.line-key{width:16px;height:4px;border-radius:3px;background:var(--purple)}.control-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control-row label{font-size:13px;font-weight:700;color:#536b80}select{display:block;width:100%;margin-top:6px;border:1px solid var(--border);border-radius:9px;padding:10px;background:#fff;color:var(--ink);font:inherit}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.button{border:0;border-radius:9px;padding:10px 13px;background:#edf2f6;color:#435a6f;font:inherit;font-weight:700;cursor:pointer}.button.primary{background:var(--blue);color:white}.button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:54px;margin-top:15px;padding:11px 12px;border-radius:10px;background:#f3f7fa;color:#536b80;font-size:14px;line-height:1.65}.order-title{font-size:13px;color:var(--muted);font-weight:700;margin:16px 0 8px}.order{display:flex;flex-wrap:wrap;gap:7px;min-height:35px}.step{display:grid;place-items:center;min-width:35px;height:35px;padding:0 8px;border-radius:18px;background:#edf1f5;color:#65798b;font-weight:800}.step.past{background:#c8eddf;color:#11684f}.step.active{background:var(--amber);color:#fff}.note{font-size:12px;line-height:1.6;color:var(--muted);margin:13px 2px 0}.footer{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.65}@media(max-width:760px){main{margin:22px auto 36px}.layout{grid-template-columns:1fr}.header{align-items:start}.panel{padding:16px}.graph-frame{margin-top:8px}}
  </style>
</head>
<body>
<main>
  <header class="header">
    <div><h1>圖的走訪：DFS 與 BFS</h1><p>沿著校園道路逐步探索六個地點。</p></div>
    <a class="back" href="./index.html">返回首頁</a>
  </header>
  <div class="layout">
    <section class="panel">
      <h2>校園地點圖</h2>
      <p class="caption">六個節點、九條無向邊。相鄰節點依字母順序探索。</p>
      <div class="graph-frame">
        <svg id="graph" class="graph" viewBox="0 0 600 340" role="img" aria-label="校門、圖書館、餐廳、系館、宿舍與體育館的道路圖">
          <g id="roads">
            <line class="road" data-edge="A-B" x1="60" y1="170" x2="210" y2="55"/><line class="road" data-edge="A-C" x1="60" y1="170" x2="210" y2="285"/><line class="road" data-edge="B-C" x1="210" y1="55" x2="210" y2="285"/><line class="road" data-edge="B-D" x1="210" y1="55" x2="390" y2="55"/><line class="road" data-edge="C-D" x1="210" y1="285" x2="390" y2="55"/><line class="road" data-edge="C-E" x1="210" y1="285" x2="390" y2="285"/><line class="road" data-edge="D-E" x1="390" y1="55" x2="390" y2="285"/><line class="road" data-edge="D-F" x1="390" y1="55" x2="540" y2="170"/><line class="road" data-edge="E-F" x1="390" y1="285" x2="540" y2="170"/>
          </g>
          <g id="trail" aria-hidden="true"></g>
          <g class="node" data-node="A"><circle cx="60" cy="170" r="26"/><text class="node-name" x="60" y="170">A</text><text class="place" x="60" y="212">校門</text></g>
          <g class="node" data-node="B"><circle cx="210" cy="55" r="26"/><text class="node-name" x="210" y="55">B</text><text class="place" x="158" y="60">圖書館</text></g>
          <g class="node" data-node="C"><circle cx="210" cy="285" r="26"/><text class="node-name" x="210" y="285">C</text><text class="place" x="158" y="290">餐廳</text></g>
          <g class="node" data-node="D"><circle cx="390" cy="55" r="26"/><text class="node-name" x="390" y="55">D</text><text class="place" x="442" y="60">系館</text></g>
          <g class="node" data-node="E"><circle cx="390" cy="285" r="26"/><text class="node-name" x="390" y="285">E</text><text class="place" x="442" y="290">宿舍</text></g>
          <g class="node" data-node="F"><circle cx="540" cy="170" r="26"/><text class="node-name" x="540" y="170">F</text><text class="place" x="540" y="212">體育館</text></g>
          <g id="start-tag" class="start-tag" visibility="hidden" pointer-events="none"><rect x="-18" y="-10" width="36" height="20" rx="8"/><text x="0" y="0">起點</text></g>
          <circle id="cursor" class="cursor" r="10" visibility="hidden"/>
        </svg>
      </div>
      <div class="legend"><span class="key"><i class="dot"></i>走訪過的節點</span><span class="key"><i class="dot focus"></i>目前節點</span><span class="key"><i class="line-key"></i>動畫走過的道路</span></div>
    </section>
    <aside class="panel">
      <h2>走訪設定</h2>
      <p class="caption">DFS 會深入探索後回溯；BFS 會先探索同一層的節點。</p>
      <div class="control-row">
        <label>演算法<select id="mode"><option value="DFS">DFS 深度優先</option><option value="BFS">BFS 廣度優先</option></select></label>
        <label>起點<select id="start"><option value="A">A 校門</option><option value="B">B 圖書館</option><option value="C">C 餐廳</option><option value="D">D 系館</option><option value="E">E 宿舍</option><option value="F">F 體育館</option></select></label>
      </div>
      <div class="buttons"><button class="button primary" id="next">下一步</button><button class="button" id="play">自動播放</button><button class="button" id="reset">重新開始</button></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="order-title">走訪順序</div><div class="order" id="order"></div>
      <p class="note">紫色路線會保留動畫游標實際走過的每一段道路，也包含經過的中繼節點。</p>
    </aside>
  </div>
  <p class="footer">改變演算法或起點會清除舊路徑並重新定位。播放時可按「暫停」；重新開始會回到所選起點。</p>
</main>
<script>
const graph={A:['B','C'],B:['A','C','D'],C:['A','B','D','E'],D:['B','C','E','F'],E:['C','D','F'],F:['D','E']};
const $=id=>document.getElementById(id);let order=[],stepIndex=-1,timer=null,animation=0,moving=false;
const coords={A:[60,170],B:[210,55],C:[210,285],D:[390,55],E:[390,285],F:[540,170]};
function buildOrder(){const start=$('start').value,mode=$('mode').value,seen=new Set([start]),result=[{node:start,from:null}];if(mode==='DFS'){function visit(node){for(const next of graph[node].slice().sort()){if(seen.has(next))continue;seen.add(next);result.push({node:next,from:node});visit(next)}}visit(start)}else{const queue=[start];for(let head=0;head<queue.length;head++){const node=queue[head];for(const next of graph[node].slice().sort()){if(seen.has(next))continue;seen.add(next);result.push({node:next,from:node});queue.push(next)}}}return result}
function shortestRoute(start,end){const queue=[[start]],seen=new Set([start]);while(queue.length){const route=queue.shift(),last=route.at(-1);if(last===end)return route;for(const next of graph[last].slice().sort()){if(seen.has(next))continue;seen.add(next);queue.push([...route,next])}}return[start,end]}
function setCursor(node){const [x,y]=coords[node];$('cursor').setAttribute('cx',x);$('cursor').setAttribute('cy',y);$('cursor').setAttribute('visibility','visible')}
function clearState(){animation++;moving=false;clearInterval(timer);timer=null;$('play').textContent='自動播放';$('trail').replaceChildren();document.querySelectorAll('.road').forEach(e=>e.classList.remove('found'));document.querySelectorAll('.node').forEach(n=>n.classList.remove('seen','focus','along'));order=buildOrder();stepIndex=-1;setCursor(order[0].node);const [x,y]=coords[order[0].node];$('start-tag').setAttribute('transform',`translate(${x+26} ${y-25})`);$('start-tag').setAttribute('visibility','visible');render()}
function render(){document.querySelectorAll('.node').forEach(n=>{const i=order.findIndex(s=>s.node===n.dataset.node);n.classList.toggle('seen',i>=0&&i<stepIndex);n.classList.toggle('focus',i===(stepIndex<0?0:stepIndex))});document.querySelectorAll('.road').forEach(e=>e.classList.remove('found'));for(let i=1;i<=stepIndex;i++){const edge=[order[i].from,order[i].node].sort().join('-');document.querySelector(`[data-edge="${edge}"]`)?.classList.add('found')}$('order').innerHTML=order.map((item,i)=>`<span class="step ${i<stepIndex?'past':''} ${i===(stepIndex<0?0:stepIndex)?'active':''}" title="${item.from?`由 ${item.from} 前往 ${item.node}`:'選定起點'}">${item.node}</span>`).join('');$('next').disabled=moving||stepIndex>=order.length-1;$('status').textContent=stepIndex<0?`起點：${order[0].node}。按「下一步」開始 ${$('mode').value}。`:`第 ${stepIndex+1} / ${order.length} 步：到達 ${order[stepIndex].node}${order[stepIndex].from?`（由 ${order[stepIndex].from} 前往）`:'（起點）'}`}
function animateRoute(route){const token=++animation;if(route.length<2){setCursor(route[0]);moving=false;render();return}moving=true;render();let segment=0;const duration=350;function nextSegment(){if(token!==animation)return;if(segment>=route.length-1){moving=false;render();return}const [x1,y1]=coords[route[segment]],[x2,y2]=coords[route[segment+1]],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','trail');line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x1);line.setAttribute('y2',y1);$('trail').appendChild(line);document.querySelector(`[data-node="${route[segment+1]}"]`).classList.add('along');const startTime=performance.now();function frame(now){if(token!==animation)return;const t=Math.min(1,(now-startTime)/duration),ease=t*t*(3-2*t),x=x1+(x2-x1)*ease,y=y1+(y2-y1)*ease;$('cursor').setAttribute('cx',x);$('cursor').setAttribute('cy',y);line.setAttribute('x2',x);line.setAttribute('y2',y);if(t<1)requestAnimationFrame(frame);else{segment++;nextSegment()}}requestAnimationFrame(frame)}nextSegment()}
function nextStep(){if(moving||stepIndex>=order.length-1)return;const previous=stepIndex<0?null:order[stepIndex].node;stepIndex++;render();if(previous)animateRoute(shortestRoute(previous,order[stepIndex].node));else setCursor(order[stepIndex].node);if(stepIndex===order.length-1&&timer){clearInterval(timer);timer=null;$('play').textContent='自動播放'}}
$('next').addEventListener('click',nextStep);$('play').addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='自動播放';return}if(stepIndex>=order.length-1)clearState();$('play').textContent='暫停';timer=setInterval(nextStep,1200)});$('reset').addEventListener('click',clearState);$('start').addEventListener('change',clearState);$('mode').addEventListener('change',clearState);clearState();
</script>
</body>
</html>
