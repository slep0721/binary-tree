<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>圖的走訪｜DFS 與 BFS</title>
<style>
:root{--bg:#e8eef4;--paper:#fff;--ink:#193047;--muted:#71869a;--edge:#c4d0da;--blue:#2877b8;--green:#16866b;--amber:#e99b10;--purple:#8061bd;--line:#d5dfe7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{width:min(1120px,94%);margin:28px auto 42px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.head p{margin:5px 0 0;color:var(--muted)}a{color:var(--blue);font-weight:700;text-decoration:none}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);gap:16px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 22px #1930470b}.panel h2{font-size:17px;margin:0 0 5px}.caption{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 12px}.svgbox{overflow:hidden;border-radius:12px;background:#dce5ed}.graph{width:100%;height:auto;display:block}.road{stroke:var(--edge);stroke-width:3;transition:stroke .18s,stroke-width .18s}.road.explored{stroke:var(--purple);stroke-width:4}.road.tree{stroke:var(--green);stroke-width:5}.road.hot{stroke:var(--amber);stroke-width:6;stroke-dasharray:8 5}.path-line{stroke:var(--purple);stroke-width:8;stroke-linecap:round;opacity:.55;pointer-events:none}.node circle{fill:#fff;stroke:#8499ad;stroke-width:2.5;transition:fill .2s,stroke .2s}.node.seen circle{fill:#c8eddf;stroke:var(--green)}.node.frontier circle{stroke:var(--blue);stroke-width:4}.node.current circle{fill:#ffdc91;stroke:#d48808;stroke-width:4}.node.midway circle{fill:#e6ddf8;stroke:var(--purple)}.node-name{font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}.place{font-size:15px;text-anchor:middle;fill:#7890a5}.start-badge rect{fill:var(--ink)}.start-badge text{fill:white;font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central}.cursor{fill:var(--amber);stroke:#fff;stroke-width:4;filter:drop-shadow(0 2px 3px #19304766);pointer-events:none}.legend,.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 15px}.legend{margin-top:12px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%;background:#c8eddf;border:1px solid var(--green)}.legend .kcur{background:#ffdc91;border-color:#d48808}.legend .kfront{background:#fff;border:3px solid var(--blue)}.legend .kpath{width:16px;height:4px;border:0;border-radius:3px;background:var(--purple)}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end}.form label{font-size:12px;font-weight:750;color:#526a7e}.form select{display:block;width:100%;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}.btn{border:0;border-radius:8px;padding:9px 12px;background:#edf2f6;color:#435a6f;font:inherit;font-size:13px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.rule{height:1px;background:#e7edf2;margin:15px 0}.vlabel{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px}.tokens{display:flex;flex-wrap:wrap;gap:6px;min-height:29px}.token{display:inline-grid;place-items:center;min-width:29px;height:28px;padding:0 8px;border-radius:7px;background:#eef2f6;color:#52687c;font-size:13px;font-weight:800}.token.head{background:#dcecff;color:#17659b}.token.checked{background:#d9f0e7;color:#12694f}.token.current{outline:2px solid var(--amber)}.empty{color:#a0acb8;font-size:13px;padding:5px 0}.message{min-height:66px;padding:10px 11px;border-radius:9px;background:#f3f7fa;color:#50677c;font-size:13px;line-height:1.65}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:14px}.controls .btn{font-size:12px;padding:9px 10px}.progress{flex:1 0 100%;height:5px;border-radius:9px;background:#e7edf2;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .18s}.count{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.foot{color:var(--muted);font-size:12px;line-height:1.6;margin:15px 1px 0}@media(max-width:780px){main{margin:20px auto 32px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.form .btn{grid-column:1/-1}.panel{padding:15px}}
</style>
</head>
<body><main>
<header class="head"><div><h1>圖的走訪：DFS／BFS</h1><p>觀察節點如何被發現、放入待辦清單，再逐一處理。</p></div><a href="./index.html">返回首頁</a></header>
<div class="grid">
<section class="panel"><h2>校園地點圖</h2><p class="caption">A–F 六個地點，九條無向道路；鄰居一律依字母順序檢查。</p><div class="svgbox"><svg id="graph" class="graph" viewBox="0 0 600 340" role="img" aria-label="校園六個地點與道路關係圖">
<g id="roads"><line class="road" data-edge="A-B" x1="60" y1="170" x2="210" y2="55"/><line class="road" data-edge="A-C" x1="60" y1="170" x2="210" y2="285"/><line class="road" data-edge="B-C" x1="210" y1="55" x2="210" y2="285"/><line class="road" data-edge="B-D" x1="210" y1="55" x2="390" y2="55"/><line class="road" data-edge="C-D" x1="210" y1="285" x2="390" y2="55"/><line class="road" data-edge="C-E" x1="210" y1="285" x2="390" y2="285"/><line class="road" data-edge="D-E" x1="390" y1="55" x2="390" y2="285"/><line class="road" data-edge="D-F" x1="390" y1="55" x2="540" y2="170"/><line class="road" data-edge="E-F" x1="390" y1="285" x2="540" y2="170"/></g><g id="walk-path"></g>
<g class="node" data-node="A"><circle cx="60" cy="170" r="26"/><text class="node-name" x="60" y="170">A</text><text class="place" x="60" y="211">校門</text></g><g class="node" data-node="B"><circle cx="210" cy="55" r="26"/><text class="node-name" x="210" y="55">B</text><text class="place" x="157" y="60">圖書館</text></g><g class="node" data-node="C"><circle cx="210" cy="285" r="26"/><text class="node-name" x="210" y="285">C</text><text class="place" x="157" y="290">餐廳</text></g><g class="node" data-node="D"><circle cx="390" cy="55" r="26"/><text class="node-name" x="390" y="55">D</text><text class="place" x="443" y="60">系館</text></g><g class="node" data-node="E"><circle cx="390" cy="285" r="26"/><text class="node-name" x="390" y="285">E</text><text class="place" x="443" y="290">宿舍</text></g><g class="node" data-node="F"><circle cx="540" cy="170" r="26"/><text class="node-name" x="540" y="170">F</text><text class="place" x="540" y="211">體育館</text></g>
<g id="start-badge" class="start-badge" visibility="hidden" pointer-events="none"><rect x="-18" y="-10" width="36" height="20" rx="8"/><text x="0" y="0">起點</text></g><circle id="cursor" class="cursor" r="9" visibility="hidden"/>
</svg></div><div class="legend"><span><i class="kcur"></i>目前處理</span><span><i class="kfront"></i>待處理</span><span><i></i>已發現</span><span><i class="kpath"></i>動畫走過的道路</span></div></section>
<aside class="panel"><h2>演算法狀態</h2><p class="caption">選擇演算法和起點後按「套用」開始一趟新的走訪。</p>
<form class="form" id="settings"><label>演算法<select id="algorithm"><option value="BFS">BFS（佇列）</option><option value="DFS">DFS（遞迴）</option></select></label><label>起點<select id="start"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select></label><button class="btn primary" type="submit">套用</button></form>
<div class="rule"></div><div class="vlabel" id="frontier-label">QUEUE · 佇列</div><div class="tokens" id="frontier"></div><div class="vlabel">VISITED · 已發現（打勾代表不會重複加入）</div><div class="tokens" id="visited"></div><div class="vlabel">ORDER · 走訪順序</div><div class="tokens" id="order"></div>
<div class="vlabel">目前步驟</div><div class="message" id="message" aria-live="polite"></div>
<div class="controls"><button class="btn" id="previous" type="button">← 上一步</button><button class="btn primary" id="next" type="button">下一步 →</button><button class="btn" id="play" type="button">▶ 自動播放</button><button class="btn" id="reset" type="button">↺ 重來</button><span class="count" id="count"></span><div class="progress"><i id="progress"></i></div></div>
<p class="foot">DFS 顯示遞迴呼叫堆疊，深入後再回溯；BFS 顯示先進先出的佇列，先探索同一層。方向鍵 ←／→ 可回退或前進，空白鍵可播放／暫停。</p>
</aside></div></main>
<script>
const graph={A:['B','C'],B:['A','C','D'],C:['A','B','D','E'],D:['B','C','E','F'],E:['C','D','F'],F:['D','E']};
const coords={A:[60,170],B:[210,55],C:[210,285],D:[390,55],E:[390,285],F:[540,170]};
const $=id=>document.getElementById(id);
let frames=[],frameIndex=0,timer=null,animId=0,moving=false,cursorNode='A';
function shortestRoute(start,end){const todo=[[start]],seen=new Set([start]);while(todo.length){const path=todo.shift(),last=path[path.length-1];if(last===end)return path;for(const n of graph[last].slice().sort()){if(seen.has(n))continue;seen.add(n);todo.push([...path,n])}}return[start,end]}
function createFrames(){
 const mode=$('algorithm').value,start=$('start').value,seen=new Set(),queue=[],stack=[],order=[],tree=[],explored=[],walked=[],walkNodes=new Set(),result=[];let lastWalk=start;
 function routeTo(target,edge){let route=[];if(edge){const approach=lastWalk===edge[0]?[lastWalk]:shortestRoute(lastWalk,edge[0]);route=approach.concat(edge[1])}else if(target&&lastWalk!==target)route=shortestRoute(lastWalk,target);for(let i=0;i<route.length-1;i++){const key=[route[i],route[i+1]].sort().join('-');if(!walked.includes(key))walked.push(key);walkNodes.add(route[i]);walkNodes.add(route[i+1])}if(route.length)lastWalk=route[route.length-1];return route}
 function save(title,message,current=null,edge=null){const movement=routeTo(current,edge);result.push({title,message,current,edge,movement,cursor:lastWalk,seen:[...seen],queue:[...queue],stack:[...stack],order:[...order],tree:tree.slice(),explored:explored.slice(),walked:walked.slice(),walkNodes:[...walkNodes]})}
 if(mode==='BFS'){
  seen.add(start);queue.push(start);save('初始化',`起點 ${start} 在加入佇列時就標記為已發現。`,start);
  while(queue.length){const u=queue.shift();order.push(u);save('取出佇列前端',`取出 ${u}，加入走訪順序。`,u);
   for(const v of graph[u].slice().sort()){const key=[u,v].sort().join('-');if(!explored.includes(key))explored.push(key);
    if(seen.has(v)){save('檢查已發現的鄰居',`${u} 檢查 ${v}：已經發現，跳過以免重複加入。`,u,[u,v]);continue}
    seen.add(v);tree.push(key);save('發現新節點',`${u} 發現 ${v}：標記 visited，${u}–${v} 成為走訪樹邊。`,u,[u,v]);queue.push(v);save('加入佇列尾端',`${v} 排入佇列尾端，稍後依 FIFO 順序處理。`,v)
   }
  }
  save('走訪完成','佇列已空；所有可到達節點都已處理。',order[order.length-1]);
 }else{
  function dfs(u,parent=null){seen.add(u);order.push(u);stack.push(u);save('進入遞迴',`進入 dfs(${u})：標記並記入走訪順序，呼叫堆疊加深。`,u);
   for(const v of graph[u].slice().sort()){const key=[u,v].sort().join('-');if(!explored.includes(key))explored.push(key);
    if(seen.has(v)){save('檢查已發現的鄰居',`${u} 檢查 ${v}：已經發現，跳過。`,u,[u,v]);continue}
    tree.push(key);save('沿走訪樹邊深入',`${v} 尚未發現，沿 ${u}–${v} 深入呼叫 dfs(${v})。`,u,[u,v]);dfs(v,u);save('遞迴回溯',`dfs(${v}) 完成，回到 dfs(${u}) 繼續檢查鄰居。`,u)
   }
   stack.pop();save('結束遞迴',`dfs(${u}) 的鄰居都檢查完畢，返回${parent?` dfs(${parent})`:'並結束走訪'}。`,parent||u)
  }
  dfs(start);save('走訪完成','所有節點都已拜訪，遞迴呼叫堆疊清空。',start)
 }
 return result
}
function render(){const s=frames[frameIndex];$('walk-path').replaceChildren();for(const key of s.walked){const [a,b]=key.split('-'),line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','path-line');line.setAttribute('x1',coords[a][0]);line.setAttribute('y1',coords[a][1]);line.setAttribute('x2',coords[b][0]);line.setAttribute('y2',coords[b][1]);$('walk-path').appendChild(line)}
 document.querySelectorAll('.road').forEach(el=>{const k=el.dataset.edge;el.classList.toggle('tree',s.tree.includes(k));el.classList.toggle('explored',s.explored.includes(k)&&!s.tree.includes(k));el.classList.toggle('hot',!!s.edge&&k===[s.edge[0],s.edge[1]].sort().join('-'))});
 document.querySelectorAll('.node').forEach(el=>{const n=el.dataset.node;el.classList.toggle('seen',s.seen.includes(n));el.classList.toggle('frontier',s.queue.includes(n)||s.stack.includes(n));el.classList.toggle('current',s.current===n);el.classList.toggle('midway',s.walkNodes.includes(n)&&!s.seen.includes(n))});
 $('frontier-label').textContent=$('algorithm').value==='BFS'?'QUEUE · 佇列（前端在左）':'CALL STACK · 遞迴呼叫堆疊';const list=$('algorithm').value==='BFS'?s.queue:s.stack;$('frontier').innerHTML=list.length?list.map((n,i)=>`<span class="token ${i===0&&$('algorithm').value==='BFS'?'head':''} ${s.current===n?'current':''}">${n}</span>`).join(''):'<span class="empty">（空）</span>';
 $('visited').innerHTML='ABCDEF'.split('').map(n=>`<span class="token ${s.seen.includes(n)?'checked':''}">${s.seen.includes(n)?'✓ ':''}${n}</span>`).join('');$('order').innerHTML=s.order.length?s.order.map((n,i)=>`<span class="token ${i===s.order.length-1?'current':''}">${n}</span>`).join(''):'<span class="empty">尚未拜訪</span>';$('message').innerHTML=`<b>${s.title}</b><br>${s.message}`;$('count').textContent=`${frameIndex+1} / ${frames.length}`;$('progress').style.width=`${frames.length<=1?100:frameIndex/(frames.length-1)*100}%`;$('previous').disabled=frameIndex===0||moving;$('next').disabled=frameIndex===frames.length-1||moving;$('reset').disabled=false
}
function animateRoute(route,target){const token=++animId;if(!route||route.length<2){cursorNode=target||cursorNode;moving=false;render();return}moving=true;render();let segment=0;function go(){if(token!==animId)return;if(segment>=route.length-1){cursorNode=target||route[route.length-1];moving=false;render();return}const a=route[segment],b=route[segment+1],[x1,y1]=coords[a],[x2,y2]=coords[b],begin=performance.now(),duration=260;function tick(now){if(token!==animId)return;const t=Math.min(1,(now-begin)/duration),e=t*t*(3-2*t);$('cursor').setAttribute('cx',x1+(x2-x1)*e);$('cursor').setAttribute('cy',y1+(y2-y1)*e);if(t<1)requestAnimationFrame(tick);else{segment++;go()}}requestAnimationFrame(tick)}go()}
function showFrame(i,animate=true){const oldIndex=frameIndex,oldCursor=cursorNode;frameIndex=Math.max(0,Math.min(frames.length-1,i));render();const frame=frames[frameIndex],target=frame.cursor||frame.current||oldCursor;if(animate){const route=frameIndex>oldIndex?frame.movement:shortestRoute(oldCursor,target);animateRoute(route,target)}else{animId++;moving=false;cursorNode=target;const [x,y]=coords[target];$('cursor').setAttribute('cx',x);$('cursor').setAttribute('cy',y);$('cursor').setAttribute('visibility','visible');render()}}
function stopPlay(){clearInterval(timer);timer=null;$('play').textContent='▶ 自動播放'}
function stepForward(){stopPlay();if(frameIndex<frames.length-1)showFrame(frameIndex+1)}
function stepBack(){stopPlay();if(frameIndex>0)showFrame(frameIndex-1)}
function resetRun(){stopPlay();showFrame(0,false)}
function applySettings(){stopPlay();frames=createFrames();cursorNode=$('start').value;const [x,y]=coords[cursorNode];$('cursor').setAttribute('cx',x);$('cursor').setAttribute('cy',y);$('cursor').setAttribute('visibility','visible');$('start-badge').setAttribute('transform',`translate(${x+27} ${y-26})`);$('start-badge').setAttribute('visibility','visible');showFrame(0,false)}
function togglePlay(){if(timer){stopPlay();return}if(frameIndex>=frames.length-1)showFrame(0,false);$('play').textContent='❚❚ 暫停';timer=setInterval(()=>{if(frameIndex>=frames.length-1){stopPlay();return}showFrame(frameIndex+1)},1050)}
$('settings').addEventListener('submit',e=>{e.preventDefault();applySettings()});$('next').addEventListener('click',stepForward);$('previous').addEventListener('click',stepBack);$('play').addEventListener('click',togglePlay);$('reset').addEventListener('click',resetRun);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();stepForward()}else if(e.key==='ArrowLeft'){e.preventDefault();stepBack()}else if(e.key===' '){e.preventDefault();togglePlay()}});applySettings();
</script></body></html>
