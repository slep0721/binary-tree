<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖的走訪 DFS / BFS</title>
<style>
:root{--bg:#edf2f7;--ink:#183047;--muted:#71849a;--line:#c5d1dc;--blue:#2563eb;--green:#0f9f78;--orange:#f59e0b;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{width:min(1080px,94%);margin:36px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.top a{color:var(--blue);text-decoration:none;font-weight:700}.top h1{font-size:clamp(26px,4vw,38px);margin:0}.intro{color:var(--muted);line-height:1.7;margin:8px 0 22px}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.75fr);gap:18px}.card{background:var(--card);border:1px solid #dce4ec;border-radius:18px;padding:20px;box-shadow:0 10px 25px #1830470b}.graph-card{min-width:0}.graph-wrap{width:100%;overflow:hidden;border-radius:14px;background:#dce5ed}.graph{display:block;width:100%;height:auto;min-height:260px}.edge{stroke:var(--line);stroke-width:3;transition:stroke .2s,stroke-width .2s}.edge.active{stroke:var(--green);stroke-width:5}.node circle{fill:white;stroke:#8399ad;stroke-width:2.5;transition:fill .2s,stroke .2s}.node.visited circle{fill:#c9f2e5;stroke:var(--green)}.node.current circle{fill:var(--orange);stroke:#d97706}.traveler{fill:var(--orange);stroke:white;stroke-width:4;filter:drop-shadow(0 2px 3px #18304766);pointer-events:none}.trail-edge{stroke:#8b5cf6;stroke-width:7;stroke-linecap:round;opacity:.65;pointer-events:none}.node.passed:not(.current) circle{fill:#e5ddff;stroke:#8b5cf6}.letter{font-size:20px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#183047}.place{font-size:15px;text-anchor:middle;fill:#758ba0}.controls h2,.graph-card h2{font-size:18px;margin:0 0 6px}.hint{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 15px}.field{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;color:#52677b}select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #d6e0e9;border-radius:9px;background:#fff;color:var(--ink);font:inherit}.modes,.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.button{border:0;border-radius:9px;padding:10px 13px;background:#e9eff5;color:#45596c;font:inherit;font-weight:700;cursor:pointer}.button.active,.button.primary{background:var(--blue);color:#fff}.button:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:17px;padding:12px;border-radius:10px;background:#f4f7fa;color:#61758a;font-size:14px;line-height:1.6;min-height:48px}.order{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;min-height:36px}.item{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e8edf2;color:#65788a;font-weight:800}.item.done{background:#c9f2e5;color:#087a5a}.item.now{background:var(--orange);color:white}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:#64788b;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c9f2e5;margin-right:5px}.legend .nowdot{background:var(--orange)}.legend .edgedot{border-radius:0;width:14px;height:3px;vertical-align:middle;background:var(--green)}.foot{color:var(--muted);font-size:13px;line-height:1.6;margin:17px 2px 0}@media(max-width:760px){main{margin:22px auto}.layout{grid-template-columns:1fr}.graph-wrap{margin-top:12px}.graph{min-height:0}}
</style>
</head>
<body><main>
<header class="top"><h1>圖的走訪 DFS / BFS</h1><a href="./index.html">← 返回 binary-tree</a></header>
<p class="intro">從校門 A 出發，逐步觀察深度優先搜尋（DFS）與廣度優先搜尋（BFS）。圖是無向圖；遇到多個相鄰節點時，依字母順序選擇。</p>
<div class="layout">
<section class="card graph-card"><h2>校園地點關係圖</h2><p class="hint">六個地點、九條道路。綠色表示發現節點的邊，紫色會累積顯示動畫走過的完整路徑。</p><div class="graph-wrap"><svg class="graph" viewBox="0 0 600 340" role="img" aria-label="A至F六個節點的無向圖"><g id="edges">
<line class="edge" data-edge="A-B" x1="65" y1="170" x2="215" y2="55"/><line class="edge" data-edge="A-C" x1="65" y1="170" x2="215" y2="285"/><line class="edge" data-edge="B-C" x1="215" y1="55" x2="215" y2="285"/><line class="edge" data-edge="B-D" x1="215" y1="55" x2="390" y2="55"/><line class="edge" data-edge="C-D" x1="215" y1="285" x2="390" y2="55"/><line class="edge" data-edge="C-E" x1="215" y1="285" x2="390" y2="285"/><line class="edge" data-edge="D-E" x1="390" y1="55" x2="390" y2="285"/><line class="edge" data-edge="D-F" x1="390" y1="55" x2="540" y2="170"/><line class="edge" data-edge="E-F" x1="390" y1="285" x2="540" y2="170"/>
</g><g id="trail" aria-hidden="true"></g><g class="node" data-node="A"><circle cx="65" cy="170" r="27"/><text class="letter" x="65" y="170">A</text><text class="place" x="65" y="215">校門</text></g><g class="node" data-node="B"><circle cx="215" cy="55" r="27"/><text class="letter" x="215" y="55">B</text><text class="place" x="165" y="48">圖書館</text></g><g class="node" data-node="C"><circle cx="215" cy="285" r="27"/><text class="letter" x="215" y="285">C</text><text class="place" x="165" y="290">餐廳</text></g><g class="node" data-node="D"><circle cx="390" cy="55" r="27"/><text class="letter" x="390" y="55">D</text><text class="place" x="440" y="48">系館</text></g><g class="node" data-node="E"><circle cx="390" cy="285" r="27"/><text class="letter" x="390" y="285">E</text><text class="place" x="440" y="290">宿舍</text></g><g class="node" data-node="F"><circle cx="540" cy="170" r="27"/><text class="letter" x="540" y="170">F</text><text class="place" x="540" y="215">體育館</text></g><circle id="traveler" class="traveler" r="11" visibility="hidden"/></svg></div><div class="legend"><span><i></i>已走訪節點</span><span><i class="nowdot"></i>目前節點</span><span><i class="edgedot"></i>演算法發現邊</span><span><i style="background:#8b5cf6"></i>動畫實際行經路徑</span></div></section>
<aside class="card controls"><h2>設定走訪</h2><p class="hint">DFS 使用堆疊式深入探索；BFS 先探索同一層的鄰居。</p><div class="field"><label>演算法<select id="algorithm"><option value="DFS">DFS 深度優先</option><option value="BFS">BFS 廣度優先</option></select></label><label>起點<select id="start"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select></label></div><div class="actions"><button class="button primary" id="step">下一步</button><button class="button" id="play">自動播放</button><button class="button" id="reset">重設</button></div><div class="status" id="status" aria-live="polite">按「下一步」開始，或播放完整走訪。</div><div class="order" id="order" aria-label="走訪順序"></div></aside>
</div><p class="foot">DFS / BFS 都會將每個節點走訪一次。切換起點或演算法後，走訪順序會重新計算。</p>
</main>
<script>
const graph={A:['B','C'],B:['A','C','D'],C:['A','B','D','E'],D:['B','C','E','F'],E:['C','D','F'],F:['D','E']};let steps=[],index=-1,timer=null;
function makeSteps(){const mode=document.querySelector('#algorithm').value,start=document.querySelector('#start').value,seen=new Set([start]),result=[{node:start,from:null}];if(mode==='DFS'){function visit(node){for(const next of graph[node].slice().sort()){if(seen.has(next))continue;seen.add(next);result.push({node:next,from:node});visit(next)}}visit(start)}else{const queue=[start];for(let head=0;head<queue.length;head++){const node=queue[head];for(const next of graph[node].slice().sort()){if(seen.has(next))continue;seen.add(next);result.push({node:next,from:node});queue.push(next)}}}return result}
let motionId=0,moving=false,passedNodes=new Set();
function pointOf(node){const circle=document.querySelector(`[data-node="${node}"] circle`);return{x:Number(circle.getAttribute('cx')),y:Number(circle.getAttribute('cy'))}}
function routeBetween(start,end){const queue=[[start]],seen=new Set([start]);while(queue.length){const route=queue.shift(),last=route[route.length-1];if(last===end)return route;for(const next of graph[last].slice().sort()){if(seen.has(next))continue;seen.add(next);queue.push([...route,next])}}return[start,end]}
function moveTraveler(start,end){const marker=document.querySelector('#traveler'),trail=document.querySelector('#trail'),token=++motionId,route=routeBetween(start,end);marker.setAttribute('visibility','visible');if(route.length===1){const p=pointOf(end);marker.setAttribute('cx',p.x);marker.setAttribute('cy',p.y);return}moving=true;document.querySelector('#step').disabled=true;let segment=0;function travelSegment(){if(token!==motionId)return;if(segment>=route.length-1){moving=false;document.querySelector('#step').disabled=index>=steps.length-1;return}const from=pointOf(route[segment]),to=pointOf(route[segment+1]),duration=320,began=performance.now(),line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','trail-edge');line.setAttribute('x1',from.x);line.setAttribute('y1',from.y);line.setAttribute('x2',from.x);line.setAttribute('y2',from.y);trail.appendChild(line);function frame(now){if(token!==motionId)return;const t=Math.min(1,(now-began)/duration),eased=t*t*(3-2*t),x=from.x+(to.x-from.x)*eased,y=from.y+(to.y-from.y)*eased;marker.setAttribute('cx',x);marker.setAttribute('cy',y);line.setAttribute('x2',x);line.setAttribute('y2',y);if(t<1)requestAnimationFrame(frame);else{passedNodes.add(route[segment+1]);document.querySelector(`[data-node="${route[segment+1]}"]`).classList.add('passed');segment++;travelSegment()}}requestAnimationFrame(frame)}travelSegment()}
function calculate(){motionId++;moving=false;passedNodes.clear();document.querySelector('#trail').replaceChildren();steps=makeSteps();index=-1;document.querySelectorAll('.node').forEach(n=>n.classList.remove('passed'));const startPoint=pointOf(steps[0].node),marker=document.querySelector('#traveler');marker.setAttribute('cx',startPoint.x);marker.setAttribute('cy',startPoint.y);marker.setAttribute('visibility','visible');paint()}
function paint(){document.querySelectorAll('.node').forEach(n=>{const at=steps.findIndex(s=>s.node===n.dataset.node),shown=index<0?0:index;n.classList.toggle('visited',at>=0&&at<index);n.classList.toggle('current',at===shown);n.classList.toggle('passed',passedNodes.has(n.dataset.node))});document.querySelectorAll('.edge').forEach(e=>e.classList.remove('active'));for(let i=1;i<=index;i++){const a=steps[i].from,b=steps[i].node;document.querySelector(`[data-edge="${[a,b].sort().join('-')}"]`)?.classList.add('active')}document.querySelector('#order').innerHTML=steps.map((s,i)=>`<span class="item ${i<index?'done':''} ${i===index?'now':''}" title="${i+1}：${s.from?`從 ${s.from} 到 ${s.node}`:'起點'}">${s.node}</span>`).join('');document.querySelector('#step').disabled=index>=steps.length-1||moving;document.querySelector('#status').textContent=index<0?`起點已選為 ${steps[0].node}，按「下一步」開始走訪。`:`第 ${index+1} / ${steps.length} 個：走訪 ${steps[index].node}${steps[index].from?`（從 ${steps[index].from} 前往）`:'（起點）'}`}
function advance(){if(moving)return;if(index<steps.length-1){const previous=index>=0?steps[index].node:null;index++;paint();if(previous)moveTraveler(previous,steps[index].node);else moveTraveler(steps[index].node,steps[index].node)}if(index>=steps.length-1)pause()}document.querySelector('#step').addEventListener('click',advance);document.querySelector('#play').addEventListener('click',()=>{if(timer){pause();return}if(index>=steps.length-1)index=-1;document.querySelector('#play').textContent='暫停';timer=setInterval(advance,1200)});document.querySelector('#reset').addEventListener('click',()=>{pause();calculate()});document.querySelector('#algorithm').addEventListener('change',()=>{pause();calculate()});document.querySelector('#start').addEventListener('change',()=>{pause();calculate()});calculate();
</script></body></html>
